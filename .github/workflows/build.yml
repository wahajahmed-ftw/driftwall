name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed to publish releases from version tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache LLVM-MinGW
        uses: actions/cache@v4
        with:
          path: tools
          key: llvm-mingw-${{ hashFiles('scripts/get-toolchain.ps1') }}

      - name: Get toolchain
        shell: pwsh
        run: ./scripts/get-toolchain.ps1

      - name: Build and package
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Check the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match VERSION $version" }

      - uses: actions/upload-artifact@v4
        with:
          name: driftwall-win-x64
          path: |
            dist/*.zip
            dist/*.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem dist/* -Include *.zip, *.sha256 | ForEach-Object FullName
          gh release create "${{ github.ref_name }}" $files --title "Driftwall ${{ github.ref_name }}" --notes-file CHANGELOG.md
